{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-6 py-12">
    <div class="glass-card p-12 rounded-[3.5rem] relative overflow-hidden space-y-12 border-2 border-primary/20">
        <!-- Decoration -->
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
        
        <div class="text-center space-y-4">
            <h1 class="text-4xl md:text-5xl font-heading font-bold text-on-surface">AI Resume Optimizer</h1>
            <p class="text-on-surface/60 max-w-xl mx-auto">Upload your resume and get instant AI feedback on how to beat the ATS and land your dream job.</p>
        </div>

        <form action="{{ url_for('resume.optimize') }}" method="POST" enctype="multipart/form-data" class="space-y-10">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Upload Area -->
            <div class="space-y-4">
                <label class="text-sm font-bold uppercase tracking-widest text-primary flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">upload_file</span>
                    Upload Resume (PDF, DOCX)
                </label>
                <div class="relative group">
                    <input type="file" name="resume" accept=".pdf,.docx" required
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                        onchange="updateFileName(this)">
                    <div id="dropzone" class="border-2 border-dashed border-outline rounded-3xl p-12 text-center group-hover:border-primary transition-all bg-surface/50">
                        <span class="material-symbols-outlined text-5xl text-on-surface/20 group-hover:text-primary mb-4 transition-all">cloud_upload</span>
                        <p id="file-name" class="text-on-surface/40 font-bold">Drag and drop or click to browse</p>
                        <p class="text-[10px] text-on-surface/20 uppercase mt-2">Maximum file size: 5MB</p>
                    </div>
                </div>
            </div>

            <!-- Job Description (Optional) -->
            <div class="space-y-4">
                <label class="text-sm font-bold uppercase tracking-widest text-primary flex items-center gap-2">
                    <span class="material-symbols-outlined text-base">description</span>
                    Target Job Description (Optional)
                </label>
                <textarea name="job_description" rows="5" 
                    placeholder="Paste the job description here for a more targeted analysis..."
                    class="w-full bg-surface border-2 border-outline rounded-3xl px-8 py-6 text-on-surface focus:border-primary transition-all resize-none"></textarea>
            </div>

            <div class="pt-6">
                <button type="submit" class="w-full py-6 rounded-[2rem] indigo-gradient text-white font-bold text-xl shadow-2xl hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-4">
                    <span class="material-symbols-outlined text-2xl">analytics</span>
                    Optimize My Resume
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function updateFileName(input) {
    const fileName = input.files[0] ? input.files[0].name : "Drag and drop or click to browse";
    document.getElementById('file-name').textContent = fileName;
    document.getElementById('file-name').classList.remove('text-on-surface/40');
    document.getElementById('file-name').classList.add('text-primary');
    document.getElementById('dropzone').classList.add('border-primary', 'bg-primary/5');
}
</script>

<style>
    .indigo-gradient {
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    }
</style>
{% endblock %}
