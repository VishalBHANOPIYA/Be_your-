{% extends "base.html" %}

{% block title %}Set Up Company | Be Your Recruiter{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-6 py-20 relative overflow-hidden">
    <!-- Ambient Background -->
    <div class="absolute inset-0 glow-overlay -z-10"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/10 blur-[150px] rounded-full -z-10"></div>

    <div class="w-full max-w-2xl glass-card p-12 rounded-[3rem] space-y-10 relative shadow-2xl border-outline">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-on-surface tracking-tight">Create Company Profile</h1>
            <p class="text-on-surface-variant text-sm">Tell us about your organization to start hiring.</p>
        </div>

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="name" class="text-xs font-bold text-primary uppercase tracking-widest ml-1">Company Name</label>
                    <input type="text" id="name" name="name" required
                        class="w-full bg-input border border-outline rounded-2xl px-5 py-4 text-on-surface focus:outline-none focus:border-primary/50 transition-all placeholder:text-on-surface-variant"
                        placeholder="e.g. Acme Inc.">
                </div>

                <div class="space-y-2">
                    <label for="location" class="text-xs font-bold text-primary uppercase tracking-widest ml-1">Headquarters</label>
                    <input type="text" id="location" name="location" required
                        class="w-full bg-input border border-outline rounded-2xl px-5 py-4 text-on-surface focus:outline-none focus:border-primary/50 transition-all placeholder:text-on-surface-variant"
                        placeholder="e.g. San Francisco, CA">
                </div>
            </div>

            <div class="space-y-2">
                <label for="website" class="text-xs font-bold text-primary uppercase tracking-widest ml-1">Website URL</label>
                <input type="url" id="website" name="website"
                    class="w-full bg-input border border-outline rounded-2xl px-5 py-4 text-on-surface focus:outline-none focus:border-primary/50 transition-all placeholder:text-on-surface-variant"
                    placeholder="https://acme.com">
            </div>

            <div class="space-y-2">
                <label for="description" class="text-xs font-bold text-primary uppercase tracking-widest ml-1">Company Bio</label>
                <textarea id="description" name="description" rows="5" required
                    class="w-full bg-input border border-outline rounded-[2rem] p-6 text-on-surface focus:outline-none focus:border-primary/50 transition-all placeholder:text-on-surface-variant resize-none leading-relaxed"
                    placeholder="Briefly describe your company mission and culture..."></textarea>
            </div>

            <button type="submit" 
                class="w-full py-5 rounded-2xl indigo-gradient text-white font-bold text-lg shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all mt-4">
                Create Profile & Continue
            </button>
        </form>
    </div>
</div>
{% endblock %}
