{% extends "base.html" %}

{% block title %}Verify Email | Be Your AI{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8 relative z-10">
        
        <!-- Glassmorphism Card -->
        <div class="glass-card p-10 rounded-[2.5rem] border border-outline shadow-2xl relative overflow-hidden bg-surface/50 backdrop-blur-xl">
            <!-- Decorative Glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/20 rounded-full blur-[60px] pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/20 rounded-full blur-[60px] pointer-events-none"></div>

            <div class="text-center relative z-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 border border-primary/20 text-primary mb-6">
                    <span class="material-symbols-outlined text-3xl">mark_email_read</span>
                </div>
                <h2 class="text-3xl font-extrabold text-on-surface mb-2">Verify Your Email</h2>
                <p class="text-on-surface/60 text-sm mb-8">
                    We've sent a 6-digit code to <strong>{{ email }}</strong>.<br>Enter it below to verify your account.
                </p>
            </div>

            <form class="space-y-6 relative z-10" action="{{ url_for('auth.verify_otp') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="space-y-2">
                    <label for="otp" class="block text-sm font-medium text-on-surface/70">6-Digit Code</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface/40 group-focus-within:text-primary transition-colors">password</span>
                        <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code" maxlength="6"
                            class="block w-full bg-background/50 border border-outline rounded-2xl pl-12 pr-4 py-4 text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-on-surface/30 tracking-[0.5em] text-center text-xl font-mono font-bold"
                            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;">
                    </div>
                </div>

                <button type="submit" class="w-full flex justify-center py-4 px-4 border border-transparent rounded-2xl text-sm font-bold text-white bg-gradient-to-r from-primary to-purple-600 hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all shadow-lg hover:shadow-primary/25 active:scale-[0.98]">
                    Verify Account
                </button>
            </form>
            
            <div class="mt-8 text-center text-sm relative z-10 space-y-4">
                <p class="text-on-surface/60">Didn't receive the code?</p>
                <form action="{{ url_for('auth.resend_otp') }}" method="POST" class="inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="font-bold text-primary hover:text-purple-400 hover:underline transition-colors">
                        Resend Code
                    </button>
                </form>
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
