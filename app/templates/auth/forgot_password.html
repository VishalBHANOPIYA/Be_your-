{% extends "base.html" %}

{% block title %}Forgot Password | Be Your{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-6 py-20 relative overflow-hidden">
    <!-- Ambient Background -->
    <div class="absolute inset-0 glow-overlay -z-10"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/10 blur-[150px] rounded-full -z-10"></div>

    <div class="w-full max-w-md glass-card p-10 rounded-[2.5rem] space-y-8 relative shadow-2xl border-outline">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-on-surface tracking-tight">Forgot Password?</h1>
            <p class="text-on-surface-variant text-sm">Enter your email to receive a secure reset link.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="space-y-2">
                <label for="email" class="text-xs font-bold text-primary uppercase tracking-widest ml-1">Email Address</label>
                <div class="relative">
                    <input type="email" id="email" name="email" required
                        class="w-full bg-input border border-outline rounded-2xl px-5 py-4 text-on-surface focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant"
                        placeholder="name@example.com">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-4 rounded-2xl indigo-gradient text-white font-bold text-lg shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all mt-4">
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-sm text-on-surface-variant">
            Remembered your password? 
            <a href="{{ url_for('auth.login') }}" class="text-primary font-bold hover:underline underline-offset-4">Back to Login</a>
        </p>
    </div>
</section>
{% endblock %}
