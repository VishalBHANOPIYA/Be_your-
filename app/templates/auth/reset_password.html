{% extends "base.html" %}

{% block title %}Reset Password | Be Your{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-6 py-20 relative overflow-hidden">
    <!-- Ambient Background -->
    <div class="absolute inset-0 glow-overlay -z-10"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/10 blur-[150px] rounded-full -z-10"></div>

    <div class="w-full max-w-md glass-card p-10 rounded-[2.5rem] space-y-8 relative shadow-2xl border-outline">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-on-surface tracking-tight">Set New Password</h1>
            <p class="text-on-surface-variant text-sm">Create a strong, secure password for your account.</p>
        </div>

        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="space-y-2">
                <label for="password" class="text-xs font-bold text-primary uppercase tracking-widest ml-1">New Password</label>
                <div class="relative group">
                    <input type="password" id="password" name="password" required
                        class="w-full bg-input border border-outline rounded-2xl px-5 py-4 text-on-surface focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant pr-14"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('password', this)" class="absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <div class="space-y-2">
                <label for="confirm_password" class="text-xs font-bold text-primary uppercase tracking-widest ml-1">Confirm Password</label>
                <div class="relative group">
                    <input type="password" id="confirm_password" name="confirm_password" required
                        class="w-full bg-input border border-outline rounded-2xl px-5 py-4 text-on-surface focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-on-surface-variant pr-14"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePassword('confirm_password', this)" class="absolute right-5 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" 
                class="w-full py-4 rounded-2xl indigo-gradient text-white font-bold text-lg shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all mt-4">
                Reset Password
            </button>
        </form>
    </div>
</section>
{% endblock %}
