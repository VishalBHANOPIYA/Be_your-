{% extends "base.html" %}

{% block title %}Interview Session | Be Your AI{% endblock %}

{% block content %}
<div class="min-h-screen pt-24 pb-12 px-6 flex items-center justify-center relative overflow-hidden">
    <!-- Ambient Background -->
    <div class="absolute inset-0 glow-overlay -z-10"></div>
    <div class="absolute top-1/4 right-1/4 w-[500px] h-[500px] bg-primary/10 blur-[120px] rounded-full -z-10 animate-pulse"></div>

    <div class="w-full max-w-4xl glass-card rounded-[3rem] p-12 relative shadow-2xl border-outline" id="interview-container">
        <!-- Progress & Timer Header -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
            <div class="flex items-center gap-6">
                <div class="w-16 h-16 rounded-2xl bg-surface border border-outline flex items-center justify-center text-primary">
                    <span class="material-symbols-outlined text-3xl">psychology</span>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-primary uppercase tracking-[0.2em]" id="phase-title">Phase 1: Aptitude</p>
                    <h2 class="text-xl font-bold" id="progress-text">Question 1 of {{ interview.questions|length }}</h2>
                </div>
            </div>

            <!-- Timer & Audio Controls -->
            <div class="flex items-center gap-6">
                <button onclick="toggleSpeech()" class="w-12 h-12 rounded-full bg-surface border border-outline flex items-center justify-center hover:scale-110 transition-all group" title="Toggle AI Voice">
                    <span class="material-symbols-outlined text-primary" id="speech-toggle-icon">volume_up</span>
                </button>

                <div class="relative w-24 h-24 flex items-center justify-center group">
                    <svg class="w-full h-full -rotate-90">
                        <circle cx="48" cy="48" r="40" stroke="currentColor" stroke-width="4" fill="transparent" class="text-white/5"></circle>
                        <circle id="timer-progress" cx="48" cy="48" r="40" stroke="currentColor" stroke-width="4" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="0" class="text-primary transition-all duration-1000"></circle>
                    </svg>
                    <div class="absolute flex flex-col items-center">
                        <span id="timer-text" class="text-2xl font-heading font-bold">90</span>
                        <span class="text-[8px] font-bold text-on-surface/40 uppercase tracking-widest">Sec</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="space-y-10" id="question-area">
            <div class="p-10 rounded-[2.5rem] bg-white/[0.02] border border-outline relative overflow-hidden">
                <div class="absolute top-0 left-0 w-1 h-full indigo-gradient"></div>
                <p class="text-[10px] font-bold text-on-surface/40 uppercase tracking-[0.3em] mb-4">Current Question</p>
                <h1 class="text-2xl md:text-3xl font-heading font-bold leading-relaxed text-on-surface" id="current-question">
                    {{ interview.questions[0] }}
                </h1>
            </div>

            <div class="space-y-4">
                <label class="text-[10px] font-bold text-primary uppercase tracking-[0.2em] ml-2">Your Professional Answer</label>
                <div class="relative">
                    <textarea id="answer-input" rows="6" 
                        class="w-full bg-input border border-outline rounded-[2rem] p-8 text-on-surface focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-white/10 resize-none leading-relaxed text-lg"
                        placeholder="Start typing your answer here... Speak naturally as if you were in a real interview."></textarea>
                    
                    <div class="absolute bottom-6 right-8 flex items-center gap-3 text-[10px] font-bold text-on-surface/30">
                        <span id="word-count">0</span> WORDS
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-6 pt-4">
                <button id="voice-btn" class="px-8 py-5 rounded-2xl border border-outline text-on-surface/80 font-bold flex items-center justify-center gap-3 hover:bg-surface transition-all">
                    <span class="material-symbols-outlined" id="voice-icon">mic</span>
                    <span id="voice-text">Start Voice</span>
                </button>
                <button id="submit-btn" class="flex-1 py-5 rounded-2xl indigo-gradient text-white font-bold text-lg shadow-2xl shadow-indigo-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    Submit Answer
                    <span class="material-symbols-outlined">send</span>
                </button>
                <button id="skip-btn" class="px-10 py-5 rounded-2xl border border-outline text-on-surface/60 font-bold hover:bg-surface transition-all">
                    Skip
                </button>
            </div>
        </div>

        <!-- Progress Bar at bottom -->
        <div class="mt-12 h-1.5 w-full bg-surface rounded-full overflow-hidden">
            <div id="bottom-progress-bar" class="h-full indigo-gradient transition-all duration-500" data-dynamic-width="{{ (1 / interview.questions|length) * 100 }}%"></div>
        </div>
    </div>
</div>

<script id="interview-data" type="application/json">
    {{ interview.questions | tojson | safe }}
</script>

<script>
    const questions = JSON.parse(document.getElementById('interview-data').textContent);
    let currentIndex = 0;
    let timerValue = 90;
    let timerInterval;
    const interviewId = "{{ interview.id }}";

    function startTimer() {
        clearInterval(timerInterval);
        timerValue = 90;
        updateTimerUI();
        
        timerInterval = setInterval(() => {
            timerValue--;
            updateTimerUI();
            
            if (timerValue <= 0) {
                clearInterval(timerInterval);
                submitAnswer(true); // Auto-submit on timeout
            }
        }, 1000);
    }

    function updateTimerUI() {
        const text = document.getElementById('timer-text');
        const circle = document.getElementById('timer-progress');
        const offset = 251.2 - (251.2 * timerValue / 90);
        
        text.innerText = timerValue;
        circle.style.strokeDashoffset = offset;
        
        if (timerValue <= 15) {
            text.classList.add('text-red-500');
            circle.classList.replace('text-primary', 'text-red-500');
        } else {
            text.classList.remove('text-red-500');
            circle.classList.replace('text-red-500', 'text-primary');
        }
    }

    async function submitAnswer(isTimeout = false) {
        const answer = document.getElementById('answer-input').value;
        const submitBtn = document.getElementById('submit-btn');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">sync</span> Processing...';

        try {
            const response = await fetch(`/ai/interview/${interviewId}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': "{{ csrf_token() }}" },
                body: JSON.stringify({ index: currentIndex, answer: answer })
            });

            if (response.ok) {
                nextQuestion();
            }
        } catch (error) {
            console.error('Submission failed', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Submit Answer <span class="material-symbols-outlined">send</span>';
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            // Update Phase Title
            let phaseTitle = "Phase 1: Aptitude";
            if (currentIndex >= 10) phaseTitle = "Phase 3: Technical";
            else if (currentIndex >= 5) phaseTitle = "Phase 2: Experience";
            
            document.getElementById('phase-title').innerText = phaseTitle;
            
            // Update UI for next question
            document.getElementById('current-question').innerText = questions[currentIndex];
            document.getElementById('answer-input').value = '';
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById('bottom-progress-bar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            document.getElementById('word-count').innerText = '0';
            
            // Animation
            gsap.from("#question-area > *", {
                y: 20,
                opacity: 0,
                duration: 0.5,
                stagger: 0.1,
                ease: "power2.out"
            });
            
            startTimer();
            speakQuestion(questions[currentIndex]);
        } else {
            finishSession();
        }
    }

    async function finishSession() {
        const container = document.getElementById('interview-container');
        container.innerHTML = `
            <div class="text-center py-20 space-y-10">
                <div class="w-32 h-32 rounded-full bg-green-500/20 border border-green-500/30 mx-auto flex items-center justify-center text-green-400">
                    <span class="material-symbols-outlined text-6xl">check_circle</span>
                </div>
                <div class="space-y-4">
                    <h1 class="text-4xl font-bold">Interview Completed!</h1>
                    <p class="text-on-surface/60 text-lg">Our AI is analyzing your performance. Your feedback will be ready in a moment.</p>
                </div>
                <div class="animate-pulse flex justify-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-primary"></div>
                    <div class="w-3 h-3 rounded-full bg-primary" style="animation-delay: 0.2s"></div>
                    <div class="w-3 h-3 rounded-full bg-primary" style="animation-delay: 0.4s"></div>
                </div>
            </div>
        `;

        try {
            const response = await fetch(`/ai/interview/${interviewId}/finish`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': "{{ csrf_token() }}" }
            });
            const data = await response.json();
            if (data.redirect) {
                setTimeout(() => window.location.href = data.redirect, 3000);
            }
        } catch (error) {
            console.error('Finalization failed', error);
        }
    }

    // Voice & Speech Synthesis Logic
    let recognition;
    let isListening = false;
    let isSpeechEnabled = true;
    const synth = window.speechSynthesis;

    function speakQuestion(text) {
        if (!isSpeechEnabled || !text) return;
        
        // Cancel any ongoing speech
        synth.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95; // Slightly slower for clarity
        utterance.pitch = 1;
        
        // Pick a professional sounding voice if available
        const voices = synth.getVoices();
        const preferredVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha'));
        if (preferredVoice) utterance.voice = preferredVoice;
        
        synth.speak(utterance);
    }

    // Toggle for AI Speech
    function toggleSpeech() {
        isSpeechEnabled = !isSpeechEnabled;
        const icon = document.getElementById('speech-toggle-icon');
        icon.innerText = isSpeechEnabled ? 'volume_up' : 'volume_off';
        if (!isSpeechEnabled) synth.cancel();
    }
    
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        
        recognition.onresult = (event) => {
            let currentTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    currentTranscript += event.results[i][0].transcript;
                }
            }
            if (currentTranscript) {
                const input = document.getElementById('answer-input');
                input.value += (input.value ? ' ' : '') + currentTranscript;
                updateWordCount();
                
                // Auto-scroll textarea
                input.scrollTop = input.scrollHeight;
            }
        };

        recognition.onstart = () => {
            isListening = true;
            const btn = document.getElementById('voice-btn');
            const icon = document.getElementById('voice-icon');
            btn.classList.add('border-red-500/50', 'bg-red-500/5');
            icon.classList.add('text-red-500', 'animate-pulse');
            document.getElementById('voice-text').innerText = 'Listening...';
        };

        recognition.onend = () => {
            isListening = false;
            const btn = document.getElementById('voice-btn');
            const icon = document.getElementById('voice-icon');
            btn.classList.remove('border-red-500/50', 'bg-red-500/5');
            icon.classList.remove('text-red-500', 'animate-pulse');
            document.getElementById('voice-text').innerText = 'Resume Voice';
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error', event.error);
            isListening = false;
        };
    }

    document.getElementById('voice-btn').onclick = () => {
        if (!recognition) {
            alert("Speech recognition not supported in this browser. Please use Chrome or Edge.");
            return;
        }
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }
    };

    function updateWordCount() {
        const text = document.getElementById('answer-input').value;
        const words = text.trim().split(/\s+/).filter(w => w.length > 0);
        document.getElementById('word-count').innerText = words.length;
    }

    // Event Listeners
    document.getElementById('submit-btn').onclick = () => {
        if (isListening) recognition.stop();
        submitAnswer();
    };
    
    document.getElementById('skip-btn').onclick = () => {
        if (isListening) recognition.stop();
        nextQuestion();
    };
    
    document.getElementById('answer-input').oninput = updateWordCount;

    // Wait for voices to load (some browsers need this)
    window.speechSynthesis.onvoiceschanged = () => {
        if (currentIndex === 0) speakQuestion(questions[0]);
    };

    // Initialize
    startTimer();
    // Immediate fallback if voices are already loaded
    setTimeout(() => {
        if (currentIndex === 0) speakQuestion(questions[0]);
    }, 1000);
</script>
{% endblock %}
